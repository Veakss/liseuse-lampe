<!doctype html>
<!-- CosyBook (la liseuse à la lampe) : la page posée à https://exigelabs.fr/liseuse/. Elle ne contient pas la liseuse : elle va la
     chercher dans le dépôt public (github.com/Veakss/liseuse-lampe, fichier web/liseuse.html, à un commit précis), par
     jsDelivr, ou par raw.githubusercontent.com si jsDelivr ne répond pas. Elle vérifie son empreinte SHA-256, puis
     l'ouvre à la place d'elle-même, à la même adresse. L'hébergement ne garde donc que cette page de quelques Ko, et les
     livres, notes et réglages du lecteur restent dans son navigateur, sous exigelabs.fr.
     Le commit, l'empreinte et la taille sont remplis par publier_site.py, qui écrit la page dans ../liseuse-web/index.html. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CosyBook</title>
<meta name="description" content="CosyBook : le même livre, une autre histoire. Une liseuse pour lire à la lampe, devant une scène peinte qui suit l’heure et la météo. PDF, ePub, Word : tout reste dans ton navigateur, rien à installer.">
<link rel="canonical" href="https://exigelabs.fr/liseuse/">
<meta property="og:type" content="website">
<meta property="og:locale" content="fr_FR">
<meta property="og:title" content="CosyBook · Le même livre, une autre histoire">
<meta property="og:description" content="Une liseuse pour lire à la lampe, devant une scène peinte qui suit l’heure et la météo. Gratuite, libre, dans le navigateur.">
<meta property="og:url" content="https://exigelabs.fr/liseuse/">
<meta property="og:image" content="https://cdn.jsdelivr.net/gh/Veakss/liseuse-lampe@{{COMMIT}}/site/img/partage.jpg">
<meta property="og:image:alt" content="La liseuse au bord d’un lac au coucher du soleil, le texte posé sur un chevalet de peintre.">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0d0a08">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314110f'/%3E%3Cpath d='M12.5 7.5h7l3 7h-13z' fill='%23e8a14b' fill-opacity='.3' stroke='%23e8a14b' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M16 14.5v8M12.5 24.5h7' fill='none' stroke='%23e8a14b' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>document.documentElement.className = 'attente';</script>
<style>
  :root { color-scheme: dark; --fond: #0d0a08; --encre: #ece2d2; --doux: #9c8e7b; --trait: #2c241d; --ambre: #e8a14b; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--fond); color: var(--encre); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
         padding: 32px 16px; transition: opacity .5s ease; }
  /* un retour rapide (liseuse déjà en cache) ne fait pas clignoter l'écran d'attente */
  .attente main { opacity: 0; }
  .lampe { position: relative; width: 120px; height: 120px; display: grid; place-items: center; }
  .lampe::before { content: ""; position: absolute; inset: 0; border-radius: 50%;
                   background: radial-gradient(closest-side, rgba(232, 161, 75, .22), rgba(232, 161, 75, 0)); }
  .lampe svg { position: relative; width: 44px; height: 44px; }
  h1 { font: 400 30px/1.2 "Iowan Old Style", Georgia, "Times New Roman", serif; letter-spacing: .005em; margin: 6px 0 0; }
  .devise { font: italic 400 17px/1.4 "Iowan Old Style", Georgia, "Times New Roman", serif; color: var(--doux); margin-top: 6px; }
  .barre { width: 200px; height: 1px; background: var(--trait); margin: 26px 0 14px; overflow: hidden; }
  .barre i { display: block; height: 100%; width: 0; background: var(--ambre); transition: width .25s linear; }
  p { margin: 0; }
  #etat { color: var(--encre); font-variant-numeric: tabular-nums; min-height: 1.55em; }
  .note { color: var(--doux); font-size: 13.5px; margin-top: 6px; max-width: 34em; }
  #echec { margin-top: 18px; }
  #echec .pourquoi { color: var(--doux); font-size: 13.5px; max-width: 34em; margin: 0 auto 16px; }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .actions button, .actions a { font: inherit; font-size: 14px; color: var(--encre); background: none; cursor: pointer;
         border: 1px solid #4a3d31; border-radius: 6px; padding: 7px 14px; text-decoration: none; }
  .actions button { border-color: var(--ambre); color: var(--ambre); }
  .actions button:hover, .actions a:hover { background: rgba(232, 161, 75, .08); }
  :focus-visible { outline: 2px solid var(--ambre); outline-offset: 2px; }
  footer { text-align: center; color: var(--doux); font-size: 12.5px; padding: 0 16px 22px; }
  footer a { color: inherit; text-underline-offset: 3px; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { main, .barre i { transition: none; } }
</style>
</head>
<body>
<main>
  <div class="lampe" aria-hidden="true">
    <svg viewBox="0 0 32 32"><path d="M12.5 7.5h7l3 7h-13z" fill="#e8a14b" fill-opacity=".3" stroke="#e8a14b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 14.5v8M12.5 24.5h7" fill="none" stroke="#e8a14b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <h1>CosyBook</h1>
  <p class="devise">Le même livre, une autre histoire.</p>
  <div class="barre" aria-hidden="true"><i id="avance"></i></div>
  <p id="etat" role="status">On allume la lampe…</p>
  <p class="note" id="note">La première fois, CosyBook se charge ({{TAILLE_MO}}). Ensuite, il s’ouvre tout de suite. Tes livres, tes notes et tes réglages restent dans ton navigateur.</p>
  <div id="echec" hidden>
    <p class="pourquoi" id="pourquoi"></p>
    <p class="actions">
      <button type="button" id="encore">Réessayer</button>
      <a href="https://github.com/Veakss/liseuse-lampe/releases/latest">Télécharger la liseuse</a>
    </p>
  </div>
  <noscript><p class="note">CosyBook a besoin de JavaScript pour s’ouvrir. Tu peux aussi le <a href="https://github.com/Veakss/liseuse-lampe/releases/latest" style="color:inherit">télécharger</a>.</p></noscript>
</main>
<footer>Libre, sous licence MIT · <a href="https://github.com/Veakss/liseuse-lampe">code source</a></footer>
<script>
(function () {
  'use strict';
  var COMMIT = '{{COMMIT}}', EMPREINTE = '{{EMPREINTE}}', TAILLE = {{TAILLE}};
  var SOURCES = [
    'https://cdn.jsdelivr.net/gh/Veakss/liseuse-lampe@' + COMMIT + '/web/liseuse.html',
    'https://raw.githubusercontent.com/Veakss/liseuse-lampe/' + COMMIT + '/web/liseuse.html'
  ];
  var $ = function (id) { return document.getElementById(id); };
  var avance = $('avance'), etat = $('etat'), note = $('note'), echec = $('echec');
  var icone = document.querySelector('link[rel="icon"]').outerHTML;
  /* l'écran d'attente n'apparaît qu'au bout de 0,3 s ; ce minuteur est annulé avant d'ouvrir la liseuse, sinon il
     viderait les classes de sa balise <html> (document.open garde les minuteurs de la fenêtre) */
  var montrer = setTimeout(function () { document.documentElement.className = ''; }, 300);

  function mo(n) { return (n / 1e6).toFixed(1).replace('.', ',') + ' Mo'; }

  /* le fichier, morceau par morceau, pour la barre (TAILLE = taille décompressée : c'est ce que donne le lecteur) */
  async function lire(url) {
    var r = await fetch(url, { mode: 'cors', credentials: 'omit', referrerPolicy: 'no-referrer' });
    if (!r.ok) throw new Error('http');
    if (!r.body || !r.body.getReader) return new Uint8Array(await r.arrayBuffer());
    var lecteur = r.body.getReader(), morceaux = [], recu = 0;
    for (;;) {
      var x = await lecteur.read();
      if (x.done) break;
      morceaux.push(x.value); recu += x.value.length;
      avance.style.width = Math.min(100, recu / TAILLE * 100).toFixed(1) + '%';
      etat.textContent = 'Chargement : ' + mo(Math.min(recu, TAILLE)) + ' sur ' + mo(TAILLE);
    }
    var tout = new Uint8Array(recu), o = 0;
    morceaux.forEach(function (m) { tout.set(m, o); o += m.length; });
    return tout;
  }

  /* la liseuse reçue doit être exactement celle publiée ; sans crypto.subtle (page non chiffrée), rien à protéger de plus */
  async function conforme(octets) {
    if (!(window.crypto && crypto.subtle)) return true;
    var h = new Uint8Array(await crypto.subtle.digest('SHA-256', octets));
    return Array.prototype.map.call(h, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('') === EMPREINTE;
  }

  function ouvrir(octets) {
    clearTimeout(montrer);
    /* le nom du site dans l'onglet, et son icône (la liseuse n'en a pas) */
    var html = new TextDecoder('utf-8').decode(octets).replace(/<title>[^<]*<\/title>/, '<title>CosyBook</title>\n' + icone);
    document.open();
    document.write(html);
    document.close();
  }

  function rater(raison) {
    avance.style.width = '0';
    etat.textContent = 'CosyBook n’a pas pu se charger.';
    note.hidden = true;
    $('pourquoi').textContent = raison === 'empreinte'
      ? 'Le fichier reçu ne correspond pas à la version publiée : par prudence, il n’est pas ouvert. Réessaie un peu plus tard, ou télécharge la liseuse.'
      : navigator.onLine === false
        ? 'Pas de connexion pour l’instant : réessaie une fois reconnecté.'
        : 'Le serveur qui la sert n’a pas répondu. Réessaie dans un moment, ou télécharge la liseuse.';
    echec.hidden = false;
    document.documentElement.className = '';
    $('encore').focus();
  }

  async function lancer() {
    var raison = 'reseau';
    echec.hidden = true; note.hidden = false;
    etat.textContent = 'On allume la lampe…';
    for (var i = 0; i < SOURCES.length; i++) {
      try {
        var octets = await lire(SOURCES[i]);
        etat.textContent = 'Vérification…';
        if (await conforme(octets)) return ouvrir(octets);
        raison = 'empreinte';
      } catch (e) { /* source suivante */ }
    }
    rater(raison);
  }

  $('encore').addEventListener('click', lancer);
  lancer();
})();
</script>
</body>
</html>
